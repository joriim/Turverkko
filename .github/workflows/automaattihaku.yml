name: Automaattihaku

# Hakee avoimista rajapinnoista uusia hankeehdokkaita ja avaa niistä pull requestin tarkistettavaksi.
# Tulokset menevät kansioon hakulahteet/automaattihaku/; aineistoon ne tulevat vasta, kun ylläpitäjä
# siirtää hyväksytyt rivit kansioon hakulahteet/tulokset/ (ks. hakulahteet/automaattihaku/README.md).

on:
  schedule:
    - cron: "17 3 * * 1"   # maanantaisin 03.17 UTC
  workflow_dispatch:
    inputs:
      naytteet:
        description: "Tulosta raakavastausten otteet lokiin (jäsentimien kehitys)"
        type: boolean
        default: false
      kokeilu:
        description: "Aja vain rajapintakokeilu (kehitys)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automaattihaku
  cancel-in-progress: false

jobs:
  haku:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Rajapintakokeilu
        if: ${{ inputs.kokeilu }}
        run: python scripts/haku/kokeile_oa.py
      - name: Saavutettavuus
        if: ${{ !inputs.kokeilu }}
        env:
          NAYTTEET: ${{ inputs.naytteet && 'naytteet' || '' }}
        run: python scripts/haku/probe.py
      - name: Näytteiden otteet lokiin
        if: ${{ !inputs.kokeilu && inputs.naytteet }}
        run: python scripts/haku/nayte.py naytteet
      - name: OpenAIRE (lähde 22)
        if: ${{ !inputs.kokeilu }}
        run: python scripts/haku/openaire.py
      - name: Julkaisuehdokkaat hankkeille (OpenAIRE)
        if: ${{ !inputs.kokeilu }}
        continue-on-error: true
        run: python scripts/haku/julkaisut.py ${{ inputs.naytteet && '--nayte' || '' }}
      - name: CORDIS – Horizon 2020 ja Horizon Europe (lähde 23)
        if: ${{ !inputs.kokeilu }}
        continue-on-error: true
        run: python scripts/haku/cordis.py
      - name: ROR-tunnisteet ja yhteisjulkaisut (ROR, OpenAIRE)
        if: ${{ !inputs.kokeilu }}
        continue-on-error: true
        run: python scripts/haku/yhteisjulkaisut.py ${{ inputs.naytteet && '--nayte' || '' }}
      - name: Hakukattavuus tunnetuilla hankkeilla
        if: ${{ !inputs.kokeilu }}
        run: python scripts/kattavuus.py
      - name: Pull request
        if: ${{ !inputs.kokeilu }}
        continue-on-error: true  # jos Actions ei saa luoda PR:ää, tulokset jäävät haaraan automaattihaku
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automaattihaku
          delete-branch: true
          add-paths: hakulahteet/automaattihaku/
          commit-message: "Automaattihaku: uudet hankeehdokkaat"
          title: "Automaattihaku: uudet hankeehdokkaat tarkistettavaksi"
          body: |
            Viikoittainen automaattihaku avoimista rajapinnoista.

            - `hakulahteet/automaattihaku/saavutettavuus.md`: mitkä lähteet vastasivat GitHubin palvelimelta
            - `hakulahteet/automaattihaku/*-<pvm>.csv`: uudet ehdokkaat, joita ei vielä ole aineistossa

            Tarkista rajaus ja siirrä hyväksytyt rivit kansioon `hakulahteet/tulokset/`
            ([ohje](../blob/main/hakulahteet/automaattihaku/README.md)). Tämä PR ei muuta aineistoa.
          labels: automaattihaku
