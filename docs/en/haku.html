<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Search – Turverkko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="../assets/style.css">
<style>
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:start;padding-block:28px}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.controls{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.res{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg);align-items:baseline}
.res:last-child{border-bottom:0}
.res:hover,.res[aria-current="true"]{background:var(--sunk)}
.res .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.res .k{font:11px var(--f-mono);color:var(--muted);white-space:nowrap}
.res .s{grid-column:2/4;font-size:13px;color:var(--muted)}
.card{position:sticky;top:72px}
@media (max-width:900px){.card{position:static}}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.rel{display:flex;flex-direction:column}
.rel > div{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.empty{padding:28px;text-align:center;color:var(--muted)}
</style>
<link rel="alternate" hreflang="fi" href="../haku.html"><link rel="alternate" hreflang="en" href="haku.html"></head>
<body>
<main class="wrap">
  <div class="layout">
    <section class="stack" aria-label="Search">
      <div class="stack" style="gap:8px">
        <h1 style="font-size:clamp(28px,4vw,40px)">Search</h1>
        <p class="note">Search by name, organisation, place or topic. Choose a result to see its card, links and sources. Project names and descriptions are in the source language.</p>
      </div>
      <div class="controls">
        <label for="q"><span class="sr">Search term</span>
          <input type="search" id="q" placeholder="e.g. restoration, SEAMK, Latvia, paludiculture" autocomplete="off">
        </label>
        <div class="row">
          <select id="f-kind" aria-label="Type"><option value="">All types</option></select>
          <select id="f-country" aria-label="Country"><option value="">All countries</option></select>
          <select id="f-theme" aria-label="Theme"><option value="">All themes</option></select>
          <select id="f-scope" aria-label="Scope"><option value="">Peatland and other soil</option><option value="turvemaa">Peatland only</option><option value="maaperä">Other soil only</option></select>
        </div>
      </div>
      <p class="note mono" id="count" aria-live="polite"></p>
      <div class="results" id="results"></div>
    </section>
    <aside class="panel card" id="card" aria-live="polite"></aside>
  </div>
</main>
<script src="../assets/common.en.js"></script>
<script>
TV.nav("haku.html"); TV.footer();
const $ = id => document.getElementById(id);
const COLLAB = ["osallistuu","kuuluu_keskukseen","yhteistyo"];
let D, items = [];

TV.load().then(d => {
  D = d;
  const ds = d.ds;
  const detail = {};
  ds.projects.forEach(p => detail[p.id] = {...p, _kind:"hanke"});
  ds.context.forEach(p => detail[p.id] = {...p, _kind:"vertailukohde"});
  ds.hubs.forEach(p => detail[p.id] = {...p, _kind:"osaamiskeskus"});
  ds.orgs.forEach(p => detail[p.id] = {...p, _kind:"organisaatio"});
  ds.pubs.forEach(p => detail[p.id] = {...p, name:p.title, _kind:"julkaisu"});
  ds.programmes.forEach(p => detail[p.id] = {...p, name:`${p.fund} ${TV.COUNTRY[p.country]||p.country} ${p.period}`, _kind:"ohjelma"});
  items = Object.values(detail).map(x => ({
    id:x.id, kind:x._kind, name:x.name, country:x.country || "", themes:x.themes || x.focus || [], raw:x,
    hay:[x.id, x.name, x.lead, x.region, x.outputs, x.note, x.target, x.members, x.authors, x.venue, x.scope, x.targets,
         (x.themes||[]).map(t => ds.themes[t] + " " + TV.v(ds.themes[t])).join(" "), TV.COUNTRY[x.country]].filter(Boolean).join(" ").toLowerCase()
  }));
  const kinds = ["hanke","osaamiskeskus","organisaatio","julkaisu","ohjelma","vertailukohde"];
  $("f-kind").innerHTML += kinds.map(k => `<option value="${k}">${TV.KIND[k]} (${items.filter(i => i.kind === k).length})</option>`).join("");
  $("f-country").innerHTML += Object.entries(TV.COUNTRY).filter(([c]) => items.some(i => i.country === c)).map(([c, n]) => `<option value="${c}">${n}</option>`).join("");
  $("f-theme").innerHTML += Object.entries(ds.themes).map(([k, v]) => `<option value="${k}">${k} ${TV.esc(TV.v(v))}</option>`).join("");
  const params = new URLSearchParams(location.search);
  if (params.get("q")) $("q").value = params.get("q");
  ["q","f-kind","f-country","f-theme","f-scope"].forEach(id => $(id).addEventListener("input", list));
  list(); show();
  window.addEventListener("hashchange", show);
}).catch(err => TV.fail($("results"), err));

function list() {
  const q = $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const k = $("f-kind").value, c = $("f-country").value, t = $("f-theme").value, sc = $("f-scope").value;
  const scopeOk = i => !sc || i.kind !== "hanke" || (i.raw.rajaus || "turvemaa") === sc;
  const order = {osaamiskeskus:0, hanke:1, vertailukohde:2, julkaisu:3, organisaatio:4, ohjelma:5};
  const hits = items.filter(i => (!k || i.kind === k) && (!c || i.country === c) && (!t || i.themes.includes(t)) && scopeOk(i) && q.every(w => i.hay.includes(w)))
    .sort((a, b) => order[a.kind] - order[b.kind] || a.name.localeCompare(b.name, TV.LANG));
  $("count").textContent = `${hits.length} / ${items.length} results`;
  const cur = decodeURIComponent(location.hash.slice(1));
  $("results").innerHTML = hits.length ? hits.map(i => `<a class="res" href="#${encodeURIComponent(i.id)}"${i.id === cur ? ' aria-current="true"' : ""}>
      ${TV.dot(i.country)}<span class="t">${TV.esc(i.name)}</span><span class="k">${TV.KIND[i.kind]}${i.raw.rajaus === "maaperä" ? " · " + TV.v("maaperä") : ""}</span>
      <span class="s">${TV.esc([TV.COUNTRY[i.country], i.raw.fund && TV.FUND[i.raw.fund] ? i.raw.fund : "", TV.v(i.raw.lead) || i.raw.org_type || i.raw.venue || i.raw.years || ""].filter(Boolean).join(" · "))}</span></a>`).join("")
    : `<div class="empty">No results. Is something missing? <a href="ehdota.html">Suggest an addition</a>.</div>`;
}

function show() {
  const id = decodeURIComponent(location.hash.slice(1));
  document.querySelectorAll(".res").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + encodeURIComponent(id)));
  const it = items.find(i => i.id === id);
  if (!it) {
    $("card").innerHTML = `<div class="eyebrow">Card</div><h2>Choose a result</h2><p class="note">The card shows funding, implementers, outputs, links to other actors and the source of every item. The card's address can be shared.</p>`;
    document.title = "Search – Turverkko"; return;
  }
  document.title = `${it.name} – Turverkko`;
  const x = it.raw, ds = D.ds, E = D.net.edges, N = D.byId;
  const name = i => (N[i] && N[i].label) || i;
  const link = i => `<a href="#${encodeURIComponent(i)}">${TV.esc(name(i))}</a>`;
  const kv = [];
  const add = (k, v) => { if (v != null && v !== "" && v !== "—") kv.push(`<dt>${k}</dt><dd>${v}</dd>`); };
  add("Type", TV.KIND[it.kind]);
  add("Country", TV.COUNTRY[x.country]);
  add("Region", TV.esc(x.region || x.scope));
  add("Fund", x.fund && (TV.FUND[x.fund] || TV.esc(x.fund)));
  add("Period", x.period ? `<span class="mono">${x.start ?? "?"}–${x.end ?? "?"} (${x.period})</span>` : x.years && `<span class="mono">${TV.esc(x.years)}</span>`);
  add("Lead", TV.esc(TV.v(x.lead)));
  add("Budget", x.eur_total != null ? `<span class="mono">${TV.eur(x.eur_total)}</span>` : x.budget && TV.esc(x.budget));
  add("EU share", x.eur_eu != null ? `<span class="mono">${TV.eur(x.eur_eu)}</span>` : "");
  add("Allocation", x.eur ? `<span class="mono">${TV.eur(x.eur)}</span>` : "");
  add("Status", x.status && `<span class="pill">${TV.esc(x.status)}</span>`);
  add("Members", TV.esc(x.members));
  add("Target", TV.esc(x.target || x.targets));
  add("Achieved", TV.esc(x.realised));
  add("Outputs", TV.esc(x.outputs));
  add("Programme", TV.esc(x.programme));
  add("Currency", TV.esc(TV.v(x.currency_note)));
  if (x.hectares && x.hectares.length) add("Hectares", `<ul class="basis">${x.hectares.map(h => `<li><b>${Math.round(h.ha).toLocaleString("en-GB")} ha</b> · ${TV.esc(TV.v(h.kind))} · ${TV.esc(TV.v(h.action))}${h.year ? " · " + h.year : ""}<br><i>“${TV.esc(h.quote)}”</i>${h.note ? " – " + TV.esc(h.note) : ""}</li>`).join("")}</ul>`);
  if (x.urls && x.urls.length > 1) add("Sources", x.urls.map((u, i) => `<a href="${u}" target="_blank" rel="noopener">${i + 1}</a>`).join(" · "));
  if (x.rajaus === "maaperä") add("Scope", `<span class="pill">other soil</span> ${TV.esc(x.rajaus_peruste)}`);
  if (x.auto_themes) add("Classification", `<span class="pill unv">themes classified automatically</span> <span class="note">imported: ${TV.esc(x.imported_from || "")}</span>`);
  add("Evidence level", x.evidence != null ? `${TV.evbar(x.evidence)} ${TV.EV[x.evidence]}` + (x.evidence_basis && x.evidence_basis.length
    ? `<ul class="basis">${x.evidence_basis.map(b => `<li>${TV.esc(TV.v(b))}</li>`).join("")}</ul>` : "") : "");
  add("Authors", TV.esc(x.authors));
  add("Publication", TV.esc([x.venue, x.year].filter(Boolean).join(", ")));
  add(it.kind === "organisaatio" ? "Organisation type" : "Publication type", x.type && `<span class="pill">${TV.esc(TV.v(x.type))}</span>${x.verified === false ? ' <span class="pill unv">metadata not opened</span>' : ""}`);
  if (it.kind !== "organisaatio") add("Organisation type", TV.esc(TV.v(x.org_type)));
  add("ROR", x.ror ? `<a href="${TV.esc(x.ror)}" target="_blank" rel="noopener" class="mono">${TV.esc(x.ror.replace("https://ror.org/", ""))}</a>` : "");
  add("Note", TV.esc(x.note));
  const nd = N[it.id]; if (nd && nd.duplicate_note) add("Duplicate entry", TV.esc(nd.duplicate_note));

  const ev = e => `<span class="pill ${e.evidence === "lähde" ? "ok" : e.evidence === "päätelty" || e.evidence === "vahvistamatta" ? "unv" : ""}">${TV.esc(TV.v(e.evidence) || "–")}</span>${e.url ? ` <a class="note" href="${e.url}" target="_blank" rel="noopener">source ↗</a>` : ""}`;
  const KN = {osallistuu:"participates", kuuluu_keskukseen:"member of centre", yhteistyo:"collaboration", ei_kytkosta:"no link found", rahoittaa:"funds", tuotos:"output", yhteisjulkaisu:"co-publications"};
  const rels = E.filter(e => (e.source === it.id || e.target === it.id) && (COLLAB.includes(e.kind) || ["ei_kytkosta","rahoittaa","tuotos","yhteisjulkaisu"].includes(e.kind)));
  const groups = {};
  rels.forEach(e => { const o = e.source === it.id ? e.target : e.source; const g = e.kind === "yhteisjulkaisu" ? "Co-publications (OpenAIRE)" : e.kind === "tuotos" ? "Outputs and publications" : e.kind === "rahoittaa" ? "Funding" : N[o] && N[o].kind === "organisaatio" ? "Organisations" : "Projects and centres"; (groups[g] ||= []).push([e, o]); });
  let relHtml = Object.entries(groups).map(([g, list]) => `<div class="eyebrow">${g} (${list.length})</div><div class="rel">${list.map(([e, o]) =>
    `<div>${N[o] ? TV.dot(N[o].country) : ""} ${link(o)} <span class="note">${KN[e.kind]}${e.note ? " · " + TV.esc(TV.v(e.note)) : ""}</span> ${ev(e)}</div>`).join("")}</div>`).join("");

  const miss = D.an.missing_links.filter(m => m.a === it.id || m.b === it.id);
  if (miss.length) relHtml += `<div class="eyebrow">Similar projects without a link (${miss.length})</div><p class="note">Similar text, no shared actor and no short collaboration path.</p><div class="rel">${miss.map(m => {
    const o = m.a === it.id ? m.b : m.a; return `<div>${TV.dot(N[o] && N[o].country)} ${link(o)} <span class="pill hot">${Number(m.score).toFixed(2)}</span> <span class="note">${TV.esc(TV.v(m.tyyppi))} · ${TV.esc(m.yhteiset)}</span></div>`; }).join("")}</div>`;
  const org = D.an.organisations.find(o => o.id === it.id);
  if (org) add("Betweenness", `<span class="mono">${org.valityskeskeisyys}</span> <span class="note">· island ${org.komponentti}</span>`);

  $("card").innerHTML = `<div class="eyebrow">${TV.KIND[it.kind]} · <span class="mono">${TV.esc(it.id)}</span></div>
    <h2>${TV.esc(it.name)}</h2>
    ${it.themes.length ? `<div class="chips">${it.themes.map(t => `<span class="pill" title="${TV.esc(TV.v(ds.themes[t]))}">${t} ${TV.esc(TV.v(ds.themes[t]) || "")}</span>`).join("")}</div>` : ""}
    <dl class="kv">${kv.join("")}</dl>
    ${relHtml}
    <div class="chips" style="margin-top:8px">${x.url ? `<a class="btn ghost" href="${x.url}" target="_blank" rel="noopener">Source ↗</a>` : ""}
      <a class="btn ghost" href="ehdota.html?kohde=${encodeURIComponent(it.id)}">Suggest a correction or link</a></div>`;
  if (innerWidth < 900) $("card").scrollIntoView({behavior: "smooth", block: "start"});
}
</script>
<style>.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style>
</body>
</html>
